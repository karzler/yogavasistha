site_name: योगवासिष्ठ — Yoga Vasiṣṭha
site_description: The Yoga Vasiṣṭha verse by verse — Sanskrit, word-by-word meaning, translation and pointers for reflection.
site_url: https://yogavasistha.bhaktology.com/
repo_url: https://github.com/karzler/yogavasistha
repo_name: karzler/yogavasistha
edit_uri: edit/main/docs/
copyright: Translation and commentary licensed under CC BY-SA 4.0

theme:
  name: material
  language: en
  font:
    text: Noto Serif
    code: Noto Sans Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.highlight
    - content.action.edit

extra_css:
  - assets/style.css

extra_javascript:
  - assets/share.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - en
        - hi

